<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>ماهر طلعت - مصمم جريدة الوطن</title>
  <style>
    body {
      font-family: 'Tahoma', sans-serif;
      background-color: #f9f9f9;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 90%;
      max-width: 600px;
      background-color: white;
      margin-top: 30px;
      padding: 20px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      border-radius: 10px;
    }
    .designer-img {
      width: 100%;
      border-radius: 10px;
    }
    h1 {
      text-align: center;
      color: #2c3e50;
    }
    .image-section {
      margin-top: 20px;
    }
    .image-section img {
      width: 100%;
      margin-top: 10px;
      border-radius: 10px;
    }
    .download-btn {
      display: block;
      width: 100%;
      margin-top: 30px;
      padding: 12px;
      background-color: #27ae60;
      color: white;
      text-decoration: none;
      text-align: center;
      border-radius: 6px;
      font-size: 16px;
    }
    .download-btn:hover {
      background-color: #219150;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="page_1.png" alt="ماهر طلعت" class="designer-img">
    <h1>ماهر طلعت</h1>
    <p style="text-align: center;">مصمم لدى جريدة الوطن</p>

    <div class="image-section">
        <h3>بعض التصميمات</h3>
      <img src="page_2.png" alt="صورة من الملف">
      <img src="page_3.png" alt="صورة أخرى من الملف">
    </div>
 <h3>تحميل ملف PDF</h3>
    <a class="download-btn" href="download (1).pdf" download>📥 تحميل ملف PDF</a>
  </div>
</body>
</html>
